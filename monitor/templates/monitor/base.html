{% load static %}<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ClimateAI{% endblock %} – {{ location }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'monitor/css/climateai.css' %}"></head>
<body data-page="{{ page }}" data-api="{% url 'api_dashboard' %}">
<aside class="sidebar"><div class="logo">ClimateAI</div><div class="nav-label">Không gian làm việc</div>
<nav class="nav">
<a href="{% url 'overview' %}" class="{% if nav == 'overview' %}active{% endif %}">Tổng quan</a>
<a href="{% url 'forecast' %}" class="{% if nav == 'forecast' %}active{% endif %}">Dự báo</a>
<a href="{% url 'suggestions' %}" class="{% if nav == 'suggestions' %}active{% endif %}">Gợi ý</a>
<a href="{% url 'history' %}" class="{% if nav == 'history' %}active{% endif %}">Lịch sử</a>
<a href="{% url 'settings' %}" class="{% if nav == 'settings' %}active{% endif %}">Cài đặt</a></nav>
<div class="side-status" id="sideStatus">Đang kiểm tra kết nối<b>…</b>ESP32 · Cảm biến</div><div class="version">Phiên bản 1.0 · Trợ lý khí hậu</div></aside>
<div class="main"><header class="topbar"><label class="loc"><select aria-label="Không gian"><option>{{ location }}</option></select></label>
<div class="right"><span id="updated">Đang tải…</span><span class="pill off" id="pill" role="status">Chưa có số liệu</span><div class="avatar" aria-hidden="true"></div></div></header>
<main class="content">{% block content %}{% endblock %}</main></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{% static 'monitor/js/climateai.js' %}"></script></body></html>
